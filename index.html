<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}

<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,vign=null;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 vign=document.createElement('canvas');vign.width=W;vign.height=H;const g=vign.getContext('2d'),gr=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.7)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
addEventListener('resize',resize);resize();
['gesturestart','dblclick','contextmenu'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
const R=Math.random,TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,dist2=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2;
const ARENA=1500,MAXE=150;
// ---------- audio ----------
let AC=null,muted=localStorage.getItem('hw_mute')==='1',lastS={},noiseBuf=null;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,f2,dur,type,vol){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol,fq){const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=fq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur)}
function sfx(n){if(!AC||muted)return;const now=performance.now();if(now-(lastS[n]||0)<(n==='shoot'||n==='hit'?60:35))return;lastS[n]=now;try{switch(n){
 case'shoot':tone(900,500,.06,'square',.025);break;case'hit':tone(300,120,.05,'triangle',.05);break;case'kill':tone(500,80,.12,'triangle',.06);break;
 case'hurt':tone(200,60,.2,'sawtooth',.09);noise(.15,.08,800);break;case'pick':tone(800,1500,.07,'sine',.04);break;case'coin':tone(1200,1800,.08,'square',.03);break;
 case'boom':noise(.4,.25,600);tone(120,40,.35,'sine',.2);break;case'zap':noise(.12,.1,3000);tone(1500,300,.1,'sawtooth',.04);break;
 case'ability':tone(400,1200,.18,'sawtooth',.06);break;case'ult':tone(150,900,.6,'sawtooth',.12);noise(.6,.15,1500);break;
 case'wave':tone(440,880,.25,'square',.06);setTimeout(()=>AC&&tone(660,1320,.3,'square',.05),150);break;case'level':tone(600,1200,.2,'sine',.08);break;
 case'buy':tone(900,1400,.1,'square',.05);break;case'over':tone(400,60,1,'sawtooth',.12);break}}catch(e){}}
// ---------- glow sprites ----------
const glowC={};
function glowSpr(c){let s=glowC[c];if(s)return s;s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,c);gr.addColorStop(.3,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=.55;g.fillStyle=gr;g.fillRect(0,0,64,64);return glowC[c]=s}
function glow(x,y,r,c){ctx.drawImage(glowSpr(c),x-r,y-r,r*2,r*2)}
// background tile
const bgTile=(()=>{const s=document.createElement('canvas');s.width=s.height=240;const g=s.getContext('2d');g.fillStyle='#0f1328';g.fillRect(0,0,240,240);g.strokeStyle='#1a2146';g.lineWidth=1.5;
 const hx=(cx,cy,r)=>{g.beginPath();for(let i=0;i<6;i++){const a=i*TAU/6+Math.PI/6;g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}g.closePath();g.stroke()};
 for(let y=0;y<=240;y+=69.28)for(let x=0;x<=240;x+=40){hx(x+((y/69.28)%2?20:0),y,22)}
 for(let i=0;i<30;i++){g.fillStyle=`rgba(${120+R()*100|0},${140+R()*80|0},255,${.1+R()*.3})`;g.fillRect(R()*240,R()*240,1.5,1.5)}return ctx.createPattern(s,'repeat')})();
// ---------- data ----------
const HEROES=[
 {id:'iron',name:'Iron Man',desc:'Repulsor bolts, fast fire',c1:'#c0262b',c2:'#f2c230',glow:'#66eeff',hp:90,spd:150,dmg:12,cd:.45},
 {id:'cap',name:'Captain America',desc:'Shield bounces between foes',c1:'#1f4fa8',c2:'#e02a2a',glow:'#6699ff',hp:120,spd:140,dmg:18,cd:1.0},
 {id:'thor',name:'Thor',desc:'Chain lightning jumps',c1:'#8a8f99',c2:'#d6262b',glow:'#99ddff',hp:110,spd:135,dmg:16,cd:.9},
 {id:'spidey',name:'Spider-Man',desc:'Webs damage & slow',c1:'#d0202a',c2:'#1d3fa0',glow:'#ffffff',hp:85,spd:175,dmg:9,cd:.5},
 {id:'hulk',name:'Hulk',desc:'Melee shockwave smash',c1:'#3c9a2e',c2:'#6a2c8a',glow:'#77ff44',hp:180,spd:125,dmg:28,cd:1.1}];
const ABIL={iron:[['MISSILE','Homing missile barrage',7],['FLARE','Repulsor nova ring',9],['UNIBEAM','Ult: sweeping chest beam']],
 cap:[['CHARGE','Shield charge dash',5],['BUBBLE','Shield bubble, reflects shots',12],['ASSEMBLE','Ult: shield storm + heal']],
 thor:[['HAMMER','Mjolnir throw & return',5],['THUNDER','Thunderclap stun',9],['STORM','Ult: god-storm lightning']],
 spidey:[['SWING','Web-swing dash',4],['TRAP','Web trap field',10],['COCOON','Ult: cocoon all foes']],
 hulk:[['LEAP','Leap slam',6],['ROAR','Roar knockback & stun',10],['RAGE','Ult: rage mode']]};
const UPG=[
 {n:'Power Up',d:'+20% damage',f:p=>p.dmgM*=1.2},{n:'Rapid Fire',d:'+15% attack speed',f:p=>p.cdM*=.87},
 {n:'Swift Feet',d:'+12% move speed',f:p=>p.spdM*=1.12},{n:'Vitality',d:'+25 max HP & heal',f:p=>{p.maxhp+=25;p.hp+=25}},
 {n:'Regeneration',d:'+1 HP/sec',f:p=>p.regen+=1},{n:'Multishot',d:'+1 projectile / jump',f:p=>p.shots++},
 {n:'Bigger Impact',d:'+20% area & size',f:p=>p.area*=1.2},{n:'Precision',d:'+8% crit chance',f:p=>p.crit+=.08},
 {n:'Vampiric',d:'+3% lifesteal',f:p=>p.ls+=.03},{n:'Magnet',d:'+40% pickup range',f:p=>p.mag*=1.4},
 {n:'Mastery',d:'-15% ability cooldowns',f:p=>p.abM*=.85},{n:'Overcharge',d:'Ult charges 30% faster',f:p=>p.ultM*=1.3},
 {hero:'iron',n:'Unibeam Core',d:'Bolts pierce +1',f:p=>p.pierce++},{hero:'iron',n:'Smart Missiles',d:'+4 missiles',f:p=>p.missiles+=4},
 {hero:'cap',n:'Vibranium Rim',d:'Shield +2 bounces',f:p=>p.bounce+=2},{hero:'cap',n:'Super Soldier',d:'+15% dmg, +10 HP',f:p=>{p.dmgM*=1.15;p.maxhp+=10}},
 {hero:'thor',n:'Mjolnir Storm',d:'+2 chain jumps',f:p=>p.chain+=2},{hero:'thor',n:'Worthy',d:'Hammer +50% dmg & size',f:p=>p.hammer*=1.5},
 {hero:'spidey',n:'Sticky Webs',d:'Slow stronger & longer',f:p=>p.slow+=.15},{hero:'spidey',n:'Spider-Sense',d:'+15% dodge chance',f:p=>p.dodge+=.15},
 {hero:'hulk',n:'Hulk Rage',d:'+30% smash radius',f:p=>p.area*=1.3},{hero:'hulk',n:'Thick Hide',d:'-12% damage taken',f:p=>p.armor*=.88}];
const SHOP=[
 {n:'Med Kit',d:'Heal 50% HP',b:6,f:p=>p.hp=Math.min(p.maxhp,p.hp+p.maxhp*.5)},{n:'Armor Plating',d:'-8% damage taken',b:14,f:p=>p.armor*=.92},
 {n:'Gamma Serum',d:'+15% damage',b:16,f:p=>p.dmgM*=1.15},{n:'Arc Reactor',d:'-12% ability cooldowns',b:15,f:p=>p.abM*=.88},
 {n:'Ult Battery',d:'+50 ult charge',b:10,f:p=>p.ult=Math.min(100,p.ult+50)},{n:'Lucky Charm',d:'+25% coin drops',b:12,f:p=>p.luck*=1.25},
 {n:'Heart Upgrade',d:'+20 max HP',b:12,f:p=>{p.maxhp+=20;p.hp+=20}},{n:'Boots',d:'+8% move speed',b:10,f:p=>p.spdM*=1.08}];
const ET={grunt:{r:13,hp:22,spd:72,dmg:10,c:'#8a4fd8',xp:1},fast:{r:10,hp:12,spd:140,dmg:7,c:'#f0b020',xp:1},tank:{r:22,hp:100,spd:45,dmg:20,c:'#6a7684',xp:4},
 ranged:{r:12,hp:24,spd:60,dmg:8,c:'#20c0b0',xp:2},exploder:{r:11,hp:16,spd:115,dmg:20,c:'#ff6a20',xp:2},shielded:{r:15,hp:40,spd:58,dmg:12,c:'#3a70e0',xp:3},
 summoner:{r:16,hp:50,spd:50,dmg:8,c:'#c040c0',xp:5},boss:{r:46,hp:700,spd:55,dmg:30,c:'#c0103f',xp:40}};
const MODS=['swift','giant','regen','volatile'];
// ---------- pools ----------
function pool(n){const a=[];for(let i=0;i<n;i++)a.push({on:0});return a}
const enemies=pool(MAXE),bullets=pool(260),parts=pool(500),nums=pool(80),gems=pool(320),fx=pool(60);
function get(p){for(const o of p)if(!o.on){o.on=1;return o}return null}
let state='menu',sel=0,P=null,wave=0,toSpawn=0,spawnT=0,cdT=0,score=0,coins=0,shake=0,flash=0,flashC='#fff',choices=[],shopItems=[],best=+localStorage.getItem('hw_best')||0,cam={x:0,y:0},time=0,picked={},bought={},god=false,banner={t:'',l:0,c:'#fff'},boss=null,kills=0;
// ---------- input ----------
const keys={};
addEventListener('keydown',e=>{initAudio();const k=e.key.toLowerCase();keys[k]=1;
 if(state==='menu'){if(k==='arrowleft')sel=(sel+4)%5;if(k==='arrowright')sel=(sel+1)%5;if(k==='enter')start()}
 else if(state==='play'){if(k==='q'||k==='j')useAbility(0);if(k==='e'||k==='k')useAbility(1);if(k==='r'||k===' '||k==='l')useAbility(2)}
 else if(state==='upgrade'&&'123'.includes(k))pick(+k-1);else if(state==='shop'){if('1234'.includes(k))buy(+k-1);if(k==='enter')cont()}
 else if(state==='over'&&k==='enter')state='menu';if(k==='m')toggleMute()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function toggleMute(){muted=!muted;localStorage.setItem('hw_mute',muted?'1':'0')}
const joy={on:0,id:null,sx:0,sy:0,x:0,y:0};
function abPos(i){return i===2?{x:W-74,y:H-80,r:40}:i===0?{x:W-172,y:H-62,r:31}:{x:W-80,y:H-182,r:31}}
function down(id,x,y){initAudio();if(state==='play'){for(let i=0;i<3;i++){const b=abPos(i);if((x-b.x)**2+(y-b.y)**2<(b.r+12)**2){useAbility(i);return}}
  if(x>W-46&&y<70+safeTop()){toggleMute();return}
  if(!joy.on){joy.on=1;joy.id=id;joy.sx=joy.x=x;joy.sy=joy.y=y}}else tap(x,y)}
function move(id,x,y){if(joy.on&&joy.id===id){joy.x=x;joy.y=y}}
function up(id){if(joy.id===id){joy.on=0;joy.id=null}}
cv.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)down(t.identifier,t.clientX,t.clientY)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)move(t.identifier,t.clientX,t.clientY)},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)up(t.identifier)},{passive:false});
cv.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)up(t.identifier)});
let mdown=0;cv.addEventListener('mousedown',e=>{mdown=1;down('m',e.clientX,e.clientY)});
addEventListener('mousemove',e=>{if(mdown)move('m',e.clientX,e.clientY)});addEventListener('mouseup',()=>{mdown=0;up('m')});
let buttons=[];
function tap(x,y){for(const b of buttons)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.f();return}}
function safeTop(){return 8}
// ---------- game flow ----------
function start(){const h=HEROES[sel];P={h,x:0,y:0,z:0,hp:h.hp,maxhp:h.hp,dmgM:1,cdM:1,spdM:1,abM:1,ultM:1,regen:0,shots:1,area:1,crit:.05,ls:0,mag:1,pierce:0,bounce:3,chain:3,slow:.4,
 missiles:8,hammer:1,dodge:0,armor:1,luck:1,atkT:0,inv:0,face:1,mdx:1,mdy:0,lvl:1,xp:0,lvlB:0,cds:[0,0],ult:0,dash:null,leap:null,bubble:0,beam:0,beamA:0,beamT:0,storm:0,stormT:0,rage:0,trail:0};
 for(const p of [enemies,bullets,parts,nums,gems,fx])for(const o of p)o.on=0;
 wave=0;score=0;coins=0;kills=0;picked={};bought={};boss=null;cam.x=cam.y=0;nextWave();state='play'}
function nextWave(){wave++;cdT=wave===1?1.2:2.5;toSpawn=wave===1?24:Math.min(16+wave*6,130);spawnT=0;boss=null;sfx('wave');
 setBanner(wave%5===0?'BOSS WAVE '+wave:'WAVE '+wave,wave%5===0?'#ff4466':'#ffcc33',2.2)}
function setBanner(t,c,l){banner={t,c,l,m:l}}
function cont(){if(state!=='shop')return;nextWave();state='play'}
function pick(i){const u=choices[i];if(!u||state!=='upgrade')return;u.f(P);picked[u.n]=(picked[u.n]||0)+1;sfx('level');genShop();state='shop'}
function genChoices(){const pl=UPG.filter(u=>!u.hero||u.hero===P.h.id);choices=[];while(choices.length<3){const u=pl[R()*pl.length|0];if(!choices.includes(u))choices.push(u)}}
function genShop(){shopItems=[];const pl=SHOP.slice();while(shopItems.length<4){const i=R()*pl.length|0;shopItems.push(pl.splice(i,1)[0])}}
function cost(it){return Math.round(it.b*(1+(bought[it.n]||0)*.6)+wave*.8)}
function buy(i){const it=shopItems[i];if(!it||state!=='shop')return;const c=cost(it);if(coins<c){sfx('hurt');return}coins-=c;it.f(P);bought[it.n]=(bought[it.n]||0)+1;sfx('buy')}
// ---------- spawning ----------
function spawnEnemy(type,x,y,noElite){const e=get(enemies);if(!e)return null;const t=ET[type];let ex=x,ey=y;
 if(ex===undefined){const a=R()*TAU,d=Math.max(W,H)*(wave===1?.45:.55)+40;ex=P.x+Math.cos(a)*d;ey=P.y+Math.sin(a)*d}
 const sc=1+wave*.13;
 Object.assign(e,{type,x:clamp(ex,-ARENA,ARENA),y:clamp(ey,-ARENA,ARENA),r:t.r,hp:t.hp*sc*(type==='boss'?(wave/5)*1.3:1),spd:t.spd*(1+wave*.012),dmg:t.dmg*(1+wave*.05),c:t.c,xp:t.xp,
  flash:0,slowT:0,stunT:0,zs:0,shT:1+R()*2,sumT:3+R()*2,chT:4,tele:0,chg:0,cvx:0,cvy:0,kx:0,ky:0,mod:null,sh:0,ph:R()*TAU});
 if(type==='shielded')e.sh=e.hp*1.2;
 if(!noElite&&type!=='boss'&&wave>=3&&R()<Math.min(.04+wave*.015,.3)){e.mod=MODS[R()*MODS.length|0];e.hp*=2.5;e.xp*=3;if(e.mod==='swift')e.spd*=1.5;if(e.mod==='giant'){e.r*=1.6;e.hp*=1.6;e.dmg*=1.4}}
 e.max=e.hp;if(e.sh)e.shMax=e.sh;if(type==='boss')boss=e;return e}
function pickType(){const r=R(),w=wave;
 if(w>=7&&r<.06)return'summoner';if(w>=6&&r<.16)return'shielded';if(w>=3&&r<.27)return'tank';if(w>=4&&r<.38)return'ranged';if(w>=2&&r<.5)return'exploder';if(r<.72)return'fast';return'grunt'}
function nearest(x,y,skip,maxd){let b=null,bd=maxd?maxd*maxd:1e12;for(const e of enemies)if(e.on&&(!skip||!skip.includes(e))){const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e}}return b}
// ---------- combat helpers ----------
function puff(x,y,c,n,s=150,sz=3){for(let i=0;i<n;i++){const p=get(parts);if(!p)return;const a=R()*TAU,v=R()*s;Object.assign(p,{x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.3+R()*.4,m:.7,c,s:sz*(.6+R()*.8)})}}
function num(x,y,t,c,big){const n=get(nums);if(n)Object.assign(n,{x:x+(R()-.5)*12,y,t,l:.75,c,big})}
function addFx(o){const f=get(fx);if(f){f.tick=0;Object.assign(f,o);f.m=f.l}return f}
const DM=()=>P.h.dmg*P.dmgM*(1+P.lvlB)*(P.rage>0?2:1);
function hurt(e,d,kx=0,ky=0){if(!e.on)return;const cr=R()<P.crit;if(cr)d*=2;
 if(e.sh>0){e.sh-=d;if(e.sh<0){d=-e.sh;e.sh=0;puff(e.x,e.y,'#88bbff',10,200)}else{num(e.x,e.y-e.r,Math.round(d),'#88bbff');e.flash=.06;return}}
 e.hp-=d;e.flash=.1;const kb=e.type==='boss'?.15:e.type==='tank'?.4:1;e.kx+=kx*kb;e.ky+=ky*kb;if(P.ls||P.rage>0)P.hp=Math.min(P.maxhp,P.hp+d*(P.ls+(P.rage>0?.05:0)));
 num(e.x,e.y-e.r,Math.round(d)+(cr?'!':''),cr?'#ffee44':'#ffffff',cr);sfx('hit');if(e.hp<=0)kill(e)}
function aoe(x,y,r,d,kb,stun,c){for(const e of enemies)if(e.on&&(e.x-x)**2+(e.y-y)**2<(r+e.r)**2){const a=Math.atan2(e.y-y,e.x-x);if(stun)e.stunT=Math.max(e.stunT,stun);hurt(e,d,Math.cos(a)*kb,Math.sin(a)*kb)}
 if(c)addFx({k:'ring',x,y,r,l:.4,c})}
function kill(e){e.on=0;kills++;score+=e.xp*10;puff(e.x,e.y,e.c,e.type==='boss'?60:10,e.type==='boss'?320:170);sfx('kill');
 P.ult=Math.min(100,P.ult+(e.type==='boss'?40:e.mod?4:1.4)*P.ultM);
 if(e.type==='boss'){shake=18;flash=.5;flashC='#ffffff';boss=null;sfx('boom');setBanner('BOSS DEFEATED!','#ffcc33',2)}else shake=Math.max(shake,2.5);
 if(e.type==='exploder'||e.mod==='volatile')explode(e.x,e.y,e.r*5,e.dmg);
 if(e.type==='summoner'){for(let i=0;i<2;i++)spawnEnemy('fast',e.x+(R()-.5)*30,e.y+(R()-.5)*30,1)}
 const n=e.type==='boss'?18:e.mod?3:1;for(let i=0;i<n;i++){const g=get(gems);if(g)Object.assign(g,{x:e.x+(R()-.5)*e.r*1.5,y:e.y+(R()-.5)*e.r*1.5,v:e.type==='boss'?3:e.mod?2:Math.max(1,e.xp/2|0),coin:0})}
 const cc=e.type==='boss'?12:e.mod?3:(R()<.28*P.luck?1:0);for(let i=0;i<cc;i++){const g=get(gems);if(g)Object.assign(g,{x:e.x+(R()-.5)*e.r*2,y:e.y+(R()-.5)*e.r*2,v:e.type==='boss'?2:1,coin:1})}}
function explode(x,y,r,d){addFx({k:'ring',x,y,r,l:.35,c:'#ff8a30'});addFx({k:'boom',x,y,r,l:.25,c:'#ffaa44'});puff(x,y,'#ffaa33',18,260,4);sfx('boom');shake=Math.max(shake,6);
 if((P.x-x)**2+(P.y-y)**2<(r+14)**2)hurtPlayer(d)}
function hurtPlayer(d){if(god||P.inv>0||P.bubble>0||P.leap)return;if(R()<P.dodge){num(P.x,P.y-24,'DODGE','#aaddff');P.inv=.2;return}
